<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도형 증명 실험실 — 중2 기하 인터랙티브 증명</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<!-- KaTeX 수식 렌더링 라이브러리 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

<style>
  :root{
    --bg: #EEF3FB;
    --grid-line: rgba(37,99,169,0.10);
    --grid-line-strong: rgba(37,99,169,0.18);
    --paper: #FFFFFF;
    --paper-edge: #D7E3F5;
    --ink: #16213E;
    --ink-soft: #4B5A79;
    --ink-faint: #8996B3;
    --teal: #0EA5A4;
    --teal-dark: #0A7A79;
    --amber: #F5A524;
    --coral: #F0546A;
    --violet: #7C6FF0;
    --blue: #3B82F6;
    --orange: #FB923C;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      linear-gradient(var(--grid-line-strong) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line-strong) 1px, transparent 1px);
    background-size: 16px 16px, 16px 16px, 80px 80px, 80px 80px;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
  }
  .font-display{ font-family:'Space Grotesk', sans-serif; }
  .font-mono{ font-family:'JetBrains Mono', monospace; }

  .paper{
    background: var(--paper);
    border: 1px solid var(--paper-edge);
    box-shadow: 0 1px 2px rgba(22,33,62,0.04), 0 8px 24px -12px rgba(22,33,62,0.12);
    border-radius: 14px;
  }

  .dim-badge{
    display:inline-flex; align-items:center; justify-content:center;
    width: 32px; height: 32px; border-radius: 999px;
    border: 1.5px dashed var(--teal); color: var(--teal-dark);
    font-family:'JetBrains Mono', monospace; font-weight:600; font-size: 13px;
    flex-shrink:0; background: #F0FBFA;
  }
  .dim-badge.done{ border-style: solid; background: var(--teal); color:white; }
  .dim-badge.active{ box-shadow: 0 0 0 4px rgba(14,165,164,0.15); }

  .tab-btn{
    display:flex; align-items:center; gap:8px; padding: 9px 13px;
    border-radius: 10px; font-size: 13px; font-weight: 600;
    color: var(--ink-soft); border: 1px solid transparent;
    transition: all .15s ease; white-space: nowrap;
  }
  .tab-btn:hover{ background: rgba(59,130,246,0.06); }
  .tab-btn.active{
    background: var(--ink); color: white;
    box-shadow: 0 4px 10px -4px rgba(22,33,62,0.4);
  }

  .proof-line{
    border-left: 3px solid var(--paper-edge);
    padding: 10px 14px; opacity: 0.45; transition: all .25s ease;
  }
  .proof-line.active{
    border-left-color: var(--teal); background: #F0FBFA;
    opacity: 1; border-radius: 0 8px 8px 0;
  }

  .quiz-btn{
    padding: 9px 15px; border-radius: 10px;
    border: 1.5px solid var(--paper-edge);
    font-family:'JetBrains Mono', monospace; font-weight:600;
    font-size: 13px; color: var(--ink); background: white;
    transition: all .12s ease;
  }
  .quiz-btn:hover{ border-color: var(--teal); background: #F0FBFA; }
  .quiz-btn.correct{ border-color: var(--teal); background: var(--teal); color:white; }
  .quiz-btn.wrong{ border-color: var(--coral); background: #FDECEE; color: var(--coral); }
  .quiz-btn:disabled{ pointer-events:none; }

  @keyframes shakeX{
    10%,90%{ transform: translateX(-2px); }
    20%,80%{ transform: translateX(4px); }
    30%,50%,70%{ transform: translateX(-6px); }
    40%,60%{ transform: translateX(6px); }
  }
  .shake{ animation: shakeX .45s cubic-bezier(.36,.07,.19,.97) both; }

  @keyframes popIn{
    0%{ opacity:0; transform: scale(.92); }
    100%{ opacity:1; transform: scale(1); }
  }
  .pop-in{ animation: popIn .25s ease-out both; }

  @keyframes pulseGlow{
    0%,100%{ filter: drop-shadow(0 0 0px currentColor); }
    50%{ filter: drop-shadow(0 0 6px currentColor); }
  }
  .pulse-glow{ animation: pulseGlow 1.5s ease-in-out infinite; }

  svg text{ font-family:'JetBrains Mono', monospace; user-select:none; }
  .grabbable{ cursor: grab; }
  .grabbable:active{ cursor: grabbing; }
  .clickable-target{ cursor: pointer; transition: transform .15s ease; }
  .clickable-target:hover{ transform: scale(1.15); }

  .focus-ring:focus-visible{ outline: 3px solid var(--blue); outline-offset: 2px; }
</style>
</head>
<body class="min-h-screen pb-10">

  <!-- 좌측 주제 선택 드로어 (모바일/터치 환경 최적 지원) -->
  <div id="drawerOverlay" class="fixed inset-0 bg-black/40 z-40 hidden opacity-0 transition-opacity duration-200"></div>
  <aside id="topicDrawer" class="fixed top-0 left-0 bottom-0 w-72 max-w-[80vw] bg-white z-50 shadow-2xl transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col p-5 border-r border-[var(--paper-edge)]">
    <div class="flex items-center justify-between pb-4 border-b border-[var(--paper-edge)] mb-4">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-[var(--ink)] text-white flex items-center justify-center flex-shrink-0">
          <i data-lucide="compass" class="w-5 h-5"></i>
        </div>
        <div>
          <h2 class="font-display font-700 text-[15px]">증명 주제 선택</h2>
          <p class="text-[11px] text-[var(--ink-faint)] font-mono">중2 기하 · 삼각형의 합동</p>
        </div>
      </div>
      <button id="closeDrawerBtn" class="p-1.5 rounded-lg text-[var(--ink-soft)] hover:bg-slate-100 focus-ring" title="닫기">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>
    <nav id="drawerNav" class="flex flex-col gap-2 flex-1 overflow-y-auto"></nav>
    <div class="pt-4 border-t border-[var(--paper-edge)] text-[11px] text-[var(--ink-faint)] font-mono text-center">
      도형 증명 실험실 · 인터랙티브 기하
    </div>
  </aside>

  <!-- 상단 네비게이션 헤더 -->
  <header class="sticky top-0 z-30 backdrop-blur bg-[#EEF3FBee] border-b border-[var(--paper-edge)]">
    <div class="max-w-7xl mx-auto px-4 md:px-6 py-3 flex items-center gap-3 flex-wrap">
      <button id="topicMenuBtn" class="flex items-center gap-2.5 hover:opacity-80 transition-opacity focus-ring rounded-xl p-1 -ml-1 text-left" title="증명 주제 선택">
        <div class="w-9 h-9 rounded-xl bg-[var(--ink)] text-white flex items-center justify-center flex-shrink-0 shadow-sm relative">
          <i data-lucide="compass" class="w-5 h-5"></i>
          <span class="absolute -top-1 -right-1 w-3 h-3 bg-[var(--teal)] rounded-full border-2 border-white"></span>
        </div>
        <div class="leading-tight">
          <div class="flex items-center gap-1">
            <h1 class="font-display font-700 text-[15px] tracking-tight">도형 증명 실험실</h1>
            <i data-lucide="chevron-down" class="w-4 h-4 text-[var(--ink-soft)]"></i>
          </div>
          <p class="text-[11px] text-[var(--teal-dark)] font-mono font-600" id="currentTopicLabel">이등변삼각형의 성질</p>
        </div>
      </button>
      <nav id="tabNav" class="hidden md:flex items-center gap-1.5 overflow-x-auto flex-1 min-w-0"></nav>
      <div class="flex items-center gap-2 ml-auto">
        <button id="prevStepBtn" class="tab-btn border border-[var(--paper-edge)] bg-white focus-ring text-[12px] py-2 px-3" title="이전 단계로 돌아가기">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
          <span>이전 단계</span>
        </button>
        <button id="resetBtn" class="tab-btn border border-[var(--paper-edge)] bg-white focus-ring text-[12px] py-2 px-3" title="이 탭을 처음부터 다시 보기">
          <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
          <span>처음부터</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 증명 인터페이스 -->
  <main class="max-w-7xl mx-auto px-4 md:px-6 pt-5">
    <!-- 단계 안내 패널 -->
    <div class="paper px-4 md:px-5 py-3.5 mb-4 flex items-start gap-3.5">
      <div id="stepBadge" class="dim-badge active mt-0.5">1</div>
      <div class="flex-1 min-w-0">
        <p id="instructionText" class="font-display font-600 text-[15px] md:text-[16px] leading-snug"></p>
        <p id="instructionSub" class="text-[13px] text-[var(--ink-soft)] mt-1"></p>
      </div>
      <button id="hintBtn" class="tab-btn border border-[var(--paper-edge)] bg-white flex-shrink-0 focus-ring py-2 px-3">
        <i data-lucide="lightbulb" class="w-4 h-4"></i>
        <span class="hidden sm:inline">힌트</span>
      </button>
    </div>

    <!-- 힌트 상자 -->
    <div id="hintPanel" class="rounded-xl px-4 py-3 mb-4 text-[13px] leading-relaxed hidden bg-[#FFF7E8] border border-[#F0DBA6] text-[#B9790E]"></div>

    <!-- Canvas & 증명 노트 레이아웃 -->
    <div class="grid grid-cols-1 lg:grid-cols-[minmax(0,1.35fr)_minmax(300px,1fr)] gap-4">
      <div class="paper p-3 md:p-4 flex items-center justify-center relative min-h-[380px]">
        <svg id="canvas" viewBox="0 0 640 460" class="w-full h-auto touch-none select-none" style="max-height: 72vh;"></svg>
      </div>

      <div class="paper p-4 md:p-5 flex flex-col min-h-[320px]">
        <div class="flex items-center gap-2 mb-3 text-[var(--ink-faint)]">
          <i data-lucide="scroll-text" class="w-4 h-4"></i>
          <h2 class="font-display font-600 text-[13px] tracking-wide uppercase">증명 노트</h2>
        </div>
        <div id="proofPanel" class="flex flex-col gap-2 flex-1 overflow-y-auto max-h-[420px] pr-1"></div>
        <div id="conclusionBox" class="hidden mt-3 rounded-xl border-2 border-[var(--teal)] bg-[#F0FBFA] px-4 py-3 pop-in">
          <div class="flex items-center gap-2 text-[var(--teal-dark)] mb-1">
            <i data-lucide="badge-check" class="w-4 h-4"></i>
            <span class="font-display font-700 text-[12px] uppercase tracking-wide">증명 완료</span>
          </div>
          <p id="conclusionText" class="font-mono text-[14px] text-[var(--ink)]"></p>
        </div>
      </div>
    </div>
  </main>

<script>
const SVGNS = "http://www.w3.org/2000/svg";

function el(tag, attrs = {}, ...children){
  const node = document.createElementNS(SVGNS, tag);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  children.forEach(c => node.appendChild(c));
  return node;
}

function polar(cx, cy, r, deg){
  const rad = deg * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

function angleOf(cx, cy, px, py){
  return Math.atan2(py - cy, px - cx) * 180 / Math.PI;
}

function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }
function mid(a, b){ return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
function norm(deg){ let d = deg % 360; if (d < 0) d += 360; return d; }

function arcPath(cx, cy, r, a1, a2){
  let d = norm(a2 - a1);
  let sweep = d > 180 ? 0 : 1;
  const p1 = polar(cx, cy, r, a1);
  const p2 = polar(cx, cy, r, a2);
  return `M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} A ${r} ${r} 0 0 ${sweep} ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
}

function rightAngleMark(V, a1, a2, size = 16){
  const p1 = polar(V.x, V.y, size, a1);
  const corner = polar(p1.x, p1.y, size, a2);
  const p2 = polar(V.x, V.y, size, a2);
  return `M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} L ${corner.x.toFixed(2)} ${corner.y.toFixed(2)} L ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
}

function tickMarks(p1, p2, count, color){
  const g = el("g");
  const m = mid(p1, p2);
  const angle = angleOf(p1.x, p1.y, p2.x, p2.y);
  const perp = angle + 90;
  const spacing = 7;
  const start = -(count - 1) * spacing / 2;
  for (let i = 0; i < count; i++){
    const along = start + i * spacing;
    const base = polar(m.x, m.y, along, angle);
    const a = polar(base.x, base.y, 6, perp);
    const b = polar(base.x, base.y, -6, perp);
    g.appendChild(el("line", { x1:a.x, y1:a.y, x2:b.x, y2:b.y, stroke:color, "stroke-width":2.5, "stroke-linecap":"round" }));
  }
  return g;
}

function labelDot(p, text, opts = {}){
  const g = el("g");
  const dx = opts.dx ?? 0, dy = opts.dy ?? -14;
  g.appendChild(el("circle", { cx:p.x, cy:p.y, r: opts.r ?? 4.5, fill: opts.fill ?? "var(--ink)" }));
  g.appendChild(el("text", { x:p.x + dx, y:p.y + dy, "font-size": opts.fontSize ?? 16, "font-weight": 600, fill: opts.textColor ?? "var(--ink)", "text-anchor":"middle" }, document.createTextNode(text)));
  return g;
}

function svgPoint(svg, evt){
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

function lineEl(p1, p2, attrs = {}){
  return el("line", Object.assign({ x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y, stroke:"var(--ink)", "stroke-width":2.5, "stroke-linecap":"round" }, attrs));
}

function pointOnSegment(p1, p2, t){ return { x: p1.x + (p2.x - p1.x) * t, y: p1.y + (p2.y - p1.y) * t }; }

const svg = document.getElementById('canvas');
const proofPanel = document.getElementById('proofPanel');
const instructionText = document.getElementById('instructionText');
const instructionSub = document.getElementById('instructionSub');
const stepBadge = document.getElementById('stepBadge');
const hintBtn = document.getElementById('hintBtn');
const hintPanel = document.getElementById('hintPanel');
const conclusionBox = document.getElementById('conclusionBox');
const conclusionText = document.getElementById('conclusionText');
const prevStepBtn = document.getElementById('prevStepBtn');

let currentTab = 1;
let currentStep = 1;
let stepHistory = [];

function renderMath(target = document.body){
  if (window.renderMathInElement) {
    window.renderMathInElement(target, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "$", right: "$", display: false}
      ],
      throwOnError: false
    });
  }
}

function clearCanvas(){ svg.innerHTML = ''; }
function clearProof(){ proofPanel.innerHTML = ''; conclusionBox.classList.add('hidden'); }

function setInstruction(step, main, sub, hint){
  currentStep = step;
  stepBadge.textContent = step;
  stepBadge.className = 'dim-badge active';
  instructionText.innerHTML = main;
  instructionSub.innerHTML = sub || '';
  hintPanel.classList.add('hidden');
  hintPanel.innerHTML = hint || '';
  hintBtn.classList.toggle('hidden', !hint);
  renderMath(instructionText);
  renderMath(instructionSub);
  renderMath(hintPanel);
}

function toggleHint(){ hintPanel.classList.toggle('hidden'); }
hintBtn.addEventListener('click', toggleHint);

function markStepDone(){
  stepBadge.classList.remove('active');
  stepBadge.classList.add('done');
  stepBadge.innerHTML = '<i data-lucide="check" class="w-3.5 h-3.5"></i>';
  lucide.createIcons();
}

function addProofLine(num, formula, note){
  const line = document.createElement('div');
  line.className = 'proof-line active pop-in';
  line.id = `proof-step-${num}`;
  line.innerHTML = `
    <div class="flex items-baseline gap-2">
      <span class="font-mono text-[11px] text-[var(--ink-faint)]">STEP ${num}</span>
    </div>
    <p class="font-mono text-[14px] font-600 mt-0.5">${formula}</p>
    <p class="text-[12.5px] text-[var(--ink-soft)] mt-0.5">${note}</p>
  `;
  Array.from(proofPanel.children).forEach(c => c.classList.remove('active'));
  proofPanel.appendChild(line);
  proofPanel.scrollTop = proofPanel.scrollHeight;
  renderMath(line);
}

function removeProofLinesFrom(stepNum){
  for(let i = stepNum; i <= 6; i++){
    const el = document.getElementById(`proof-step-${i}`);
    if(el) el.remove();
  }
  conclusionBox.classList.add('hidden');
}

function showConclusion(mathText){
  conclusionText.innerHTML = mathText;
  conclusionBox.classList.remove('hidden');
  renderMath(conclusionBox);
  lucide.createIcons();
}

function shakeEl(node){
  node.classList.remove('shake');
  void node.offsetWidth;
  node.classList.add('shake');
}

function buildQuiz(container, question, options, correctCheck, onCorrect){
  const wrap = document.createElement('div');
  wrap.className = 'pop-in mt-2';
  const q = document.createElement('p');
  q.className = 'text-[13px] font-600 mb-2.5';
  q.innerHTML = question;
  renderMath(q);
  wrap.appendChild(q);

  const btnRow = document.createElement('div');
  btnRow.className = 'flex flex-wrap gap-2';
  let answered = false;
  options.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'quiz-btn focus-ring';
    b.textContent = opt;
    b.addEventListener('click', () => {
      if (answered) return;
      const isCorrect = typeof correctCheck === 'function' ? correctCheck(opt, i) : (i === correctCheck);
      if (isCorrect){
        answered = true;
        b.classList.add('correct');
        Array.from(btnRow.children).forEach(x => x.disabled = true);
        setTimeout(() => onCorrect(opt), 350);
      } else {
        b.classList.add('wrong');
        shakeEl(b);
        setTimeout(() => b.classList.remove('wrong'), 500);
      }
    });
    btnRow.appendChild(b);
  });
  wrap.appendChild(btnRow);
  container.appendChild(wrap);
  return wrap;
}

/* ==========================================================================
   Tab 1: 이등변삼각형의 성질 (두 밑각의 크기가 같다 / 꼭짓각의 이등분선)
   ========================================================================== */
function initTab1(startStep = 1){
  clearCanvas(); clearProof();
  const A = {x:320,y:64}, B = {x:150,y:380}, C = {x:490,y:380};
  const D = mid(B,C);

  const mainGroup = el('g');
  svg.appendChild(mainGroup);

  const gLeft = el('g');
  const gRight = el('g');
  mainGroup.appendChild(gLeft);
  mainGroup.appendChild(gRight);

  function renderBaseTriangle(){
    gLeft.innerHTML = ''; gRight.innerHTML = '';
    gLeft.appendChild(lineEl(A,B));
    gLeft.appendChild(lineEl(B,D));
    gLeft.appendChild(tickMarks(A,B,1,'var(--blue)'));
    gLeft.appendChild(labelDot(A,'A',{dy:-12}));
    gLeft.appendChild(labelDot(B,'B',{dx:-14,dy:6}));

    gRight.appendChild(lineEl(A,C));
    gRight.appendChild(lineEl(D,C));
    gRight.appendChild(tickMarks(A,C,1,'var(--blue)'));
    gRight.appendChild(labelDot(A,'A',{dy:-12}));
    gRight.appendChild(labelDot(C,'C',{dx:14,dy:6}));
  }

  function step1(){
    removeProofLinesFrom(1);
    renderBaseTriangle();
    setInstruction(1, '밑변 $BC$의 <strong>가운데 점(중점)</strong>을 콕 눌러보세요', '점 $B$와 점 $C$ 딱 중간에 있는 위치를 찾아보세요.', '선분 $BC$의 정중앙에 있는 점을 클릭하면 점 $D$가 표시됩니다.');
    
    const zone = el('line', {x1:B.x,y1:B.y,x2:C.x,y2:C.y,stroke:'transparent','stroke-width':30, class:'grabbable focus-ring', tabindex:'0'});
    svg.appendChild(zone);

    const guideDots = el('g');
    svg.appendChild(guideDots);
    [0.25, 0.5, 0.75].forEach(t => {
      const p = pointOnSegment(B,C,t);
      guideDots.appendChild(el('circle',{cx:p.x,cy:p.y,r:6,fill:'var(--teal)', opacity: t===0.5?1:0.3}));
    });

    function pickMid(pt){
      const t = (pt.x - B.x) / (C.x - B.x);
      if (Math.abs(t - 0.5) < 0.12){
        guideDots.remove(); zone.remove();
        addProofLine(1, '$\\overline{BD} = \\overline{CD}$', '밑변의 중점 $D$를 잡았습니다');
        markStepDone();
        step2();
      } else {
        shakeEl(guideDots);
      }
    }
    zone.addEventListener('pointerdown', (e) => pickMid(svgPoint(svg, e)));
  }

  function step2(){
    removeProofLinesFrom(2);
    renderBaseTriangle();
    gLeft.appendChild(tickMarks(B,D,2,'var(--orange)'));
    gRight.appendChild(tickMarks(D,C,2,'var(--orange)'));
    gLeft.appendChild(labelDot(D,'D',{dx:-10,dy:22}));
    gRight.appendChild(labelDot(D,'D',{dx:10,dy:22}));

    setInstruction(2, '꼭짓점 $A$를 잡고 점 $D$까지 <strong>선을 쭉 그어보세요</strong>', '위쪽 꼭짓점 $A$에서 아래 중점 $D$로 보조선을 연결합니다.', '파란 원을 누른 채로 아래 점 $D$까지 끌어당기세요.');
    
    const handle = el('circle',{cx:A.x,cy:A.y,r:12,fill:'var(--teal)',opacity:0.85,class:'grabbable'});
    svg.appendChild(handle);
    let dragLine = null, dragging = false;

    handle.addEventListener('pointerdown', (e)=>{
      dragging = true;
      handle.setPointerCapture(e.pointerId);
      dragLine = lineEl(A,A,{stroke:'var(--violet)','stroke-dasharray':'5 5','stroke-width':3});
      svg.insertBefore(dragLine, handle);
    });
    handle.addEventListener('pointermove', (e)=>{
      if(!dragging) return;
      const p = svgPoint(svg,e);
      dragLine.setAttribute('x2', p.x); dragLine.setAttribute('y2', p.y);
    });
    handle.addEventListener('pointerup', (e)=>{
      dragging = false;
      const p = svgPoint(svg,e);
      if (dist(p, D) < 40){
        dragLine.remove(); handle.remove();
        gLeft.appendChild(lineEl(A,D,{stroke:'var(--violet)','stroke-width':3}));
        gRight.appendChild(lineEl(A,D,{stroke:'var(--violet)','stroke-width':3}));
        addProofLine(2, '$\\overline{AD}$는 공통', '보조선 $AD$를 그어 두 개의 삼각형으로 나누었습니다');
        markStepDone();
        step3();
      } else {
        dragLine.remove();
        shakeEl(handle);
      }
    });
  }

  function step3(){
    removeProofLinesFrom(3);
    renderBaseTriangle();
    gLeft.appendChild(tickMarks(B,D,2,'var(--orange)')); gRight.appendChild(tickMarks(D,C,2,'var(--orange)'));
    gLeft.appendChild(lineEl(A,D,{stroke:'var(--violet)','stroke-width':3})); gRight.appendChild(lineEl(A,D,{stroke:'var(--violet)','stroke-width':3}));
    gLeft.appendChild(labelDot(D,'D',{dx:-10,dy:22})); gRight.appendChild(labelDot(D,'D',{dx:10,dy:22}));

    setInstruction(3, '슬라이더를 오른쪽으로 밀어 <strong>두 삼각형을 분리해보세요</strong>', '두 삼각형의 세 변이 각각 같은지 직접 눈으로 비교합니다.', '슬라이더를 끝까지 밀면 두 삼각형이 분리되며 서로 대응하는 변이 명확히 보입니다.');

    const sliderFO = el('foreignObject',{x:170, y:415, width:300, height:40});
    sliderFO.innerHTML = `<input type="range" min="0" max="100" value="0" style="width:100%" class="focus-ring" id="splitSlider">`;
    svg.appendChild(sliderFO);

    const slider = sliderFO.querySelector('#splitSlider');
    let btnAdded = false;

    slider.addEventListener('input', ()=>{
      const v = slider.value / 100;
      const shift = 60 * v;
      gLeft.setAttribute('transform', `translate(${-shift}, ${-shift*0.25})`);
      gRight.setAttribute('transform', `translate(${shift}, ${-shift*0.25})`);
      if (v > 0.6 && !btnAdded){
        btnAdded = true;
        showSplitConfirm();
      }
    });

    function showSplitConfirm(){
      const fo = el('foreignObject',{x:220,y:230,width:200,height:44});
      fo.innerHTML = `<button id="confirmSplit" class="quiz-btn focus-ring" style="background:var(--ink);color:white;border-color:var(--ink);width:100%">세 변의 길이 일치 확인 →</button>`;
      svg.appendChild(fo);
      fo.querySelector('#confirmSplit').addEventListener('click', ()=>{
        addProofLine(3, '$\\overline{AB}=\\overline{AC},\\; \\overline{BD}=\\overline{CD},\\; \\overline{AD}$ 공통', '세 쌍의 대응변의 길이가 모두 같습니다');
        markStepDone();
        fo.remove(); sliderFO.remove();
        step4();
      });
    }
  }

  function step4(){
    removeProofLinesFrom(4);
    setInstruction(4, '두 삼각형의 합동 조건과 결론을 선택해주세요', '발견한 세 변의 관계를 바탕으로 알맞은 합동 조건을 고르세요.', 'SSS 합동에 의해 두 밑각 $\\angle B$와 $\\angle C$의 크기가 같습니다.');

    buildQuiz(proofPanel, '$\\triangle ABD \\equiv \\triangle ACD$ 정당화 조건 선택:', ['SSS 합동','SAS 합동','ASA 합동'], 0, ()=>{
      addProofLine(4, '$\\triangle ABD \\equiv \\triangle ACD$ (SSS 합동)', '세 대응변의 길이가 각각 같으므로 두 삼각형은 합동입니다');
      showConclusion('$\\angle B = \\angle C$ (이등변삼각형의 두 밑각의 크기는 같다)');
      markStepDone();
    });
  }

  stepHistory = [step1, step2, step3, step4];
  stepHistory[startStep - 1]();
}

/* ==========================================================================
   Tab 2: 이등변삼각형이 되는 조건 (두 내각의 크기가 같은 삼각형)
   ========================================================================== */
function initTab2(startStep = 1){

  function drawTriangle(){

    g.appendChild(labelDot(A,'A',{dy:-12}));
    g.appendChild(labelDot(B,'B',{dx:-14,dy:8}));
    g.appendChild(labelDot(C,'C',{dx:14,dy:8}));
    
    // 각 B, 각 C 같은 각 표시
    const aB = arcPath(B.x,B.y, 30, angleOf(B.x,B.y,C.x,C.y), angleOf(B.x,B.y,A.x,A.y));
    const aC = arcPath(C.x,C.y, 30, angleOf(C.x,C.y,A.x,A.y), angleOf(C.x,C.y,B.x,B.y));

  function step1(){

    const target = el('circle',{cx:A.x, cy:A.y+15, r:18, fill:'var(--violet)', opacity:0.3, class:'clickable-target focus-ring', tabindex:0});

    target.addEventListener('click', ()=>{
      target.remove();
      g.appendChild(lineEl(A,D,{stroke:'var(--violet)','stroke-width':2.5,'stroke-dasharray':'4 4'}));
      g.appendChild(labelDot(D,'D',{dy:20}));
      
      // 각 BAD, CAD 표시
      const a1 = arcPath(A.x,A.y,28, angleOf(A.x,A.y,B.x,B.y), angleOf(A.x,A.y,D.x,D.y));
      const a2 = arcPath(A.x,A.y,28, angleOf(A.x,A.y,D.x,D.y), angleOf(A.x,A.y,C.x,C.y));
      g.appendChild(el('path',{d:a1, stroke:'var(--amber)','stroke-width':2.5, fill:'none'}));
      g.appendChild(el('path',{d:a2, stroke:'var(--amber)','stroke-width':2.5, fill:'none'}));

      addProofLine(1, '$\\angle BAD = \\angle CAD$', '꼭짓각 $A$의 이등분선 $AD$를 그었습니다');
      markStepDone();
      step2();
    });
  }

  function step2(){
    removeProofLinesFrom(2);
    setInstruction(2, '삼각형의 세 내각의 합($180^\\circ$)을 이용하여 <strong>$\\angle ADB$와 $\\angle ADC$</strong> 관계를 밝혀보세요', '$\\angle B = \\angle C$ 이고 $\\angle BAD = \\angle CAD$ 이므로 나머지 한 각도 서로 같습니다.', '질문에 답하면 단계가 진행됩니다.');

    buildQuiz(proofPanel, '$\\angle B=\\angle C$, $\\angle BAD=\\angle CAD$ 일 때 $\\angle ADB$와 $\\angle ADC$의 관계는?', ['$\\angle ADB = \\angle ADC$', '$\\angle ADB > \\angle ADC$', '알 수 없다'], 0, ()=>{
      addProofLine(2, '$\\angle ADB = \\angle ADC$', '두 내각이 각각 같으므로 나머지 한 각의 크기도 같습니다');
      markStepDone();
      step3();
    });
  }

  function step3(){
    removeProofLinesFrom(3);
    setInstruction(3, '$\\triangle ABD$와 $\\triangle ACD$의 <strong>합동 조건</strong>을 찾아보세요', '각 $BAD=\\angle CAD$, 선분 $AD$ 공통, 각 $ADB=\\angle ADC$ 관계를 이용하세요.', '한 변의 길이와 그 양 끝각이 각각 같으므로 ASA 합동입니다.');

    buildQuiz(proofPanel, '$\\triangle ABD \\equiv \\triangle ACD$의 합동 조건은?', ['SAS 합동','ASA 합동','RHS 합동'], 1, ()=>{
      addProofLine(3, '$\\triangle ABD \\equiv \\triangle ACD$ (ASA 합동)', '선분 $AD$는 공통이고 양 끝각의 크기가 같습니다');
      showConclusion('$\\overline{AB} = \\overline{AC}$ (두 내각의 크기가 같은 삼각형은 이등변삼각형이다)');
      markStepDone();
    });
  }

  stepHistory = [step1, step2, step3];
  stepHistory[startStep - 1]();
}

/* ==========================================================================
   Tab 3: 직각삼각형의 RHS 합동 (빗변과 한 다른 변이 같을 때)

function initTab3(startStep = 1){

    buildQuiz(proofPanel, '$\\triangle ABD$는 어떤 삼각형인가요?', ['이등변삼각형','정삼각형','직각삼각형'], 0, ()=>{
      addProofLine(1, '$\\overline{AB} = \\overline{AD} \\implies \\triangle ABD$는 이등변삼각형', '길이가 같은 변 $AC$를 붙여 큰 이등변삼각형을 만들었습니다');
      markStepDone();
      step2();
    });

    buildQuiz(proofPanel, '$\\angle B$와 $\\angle D$의 크기 관계는?', ['$\\angle B = \\angle D$','$\\angle B > \\angle D$','$\\angle B + \\angle D = 90^\\circ$'], 0, ()=>{
      addProofLine(2, '$\\angle B = \\angle D$', '이등변삼각형의 두 밑각의 크기는 같습니다');
      markStepDone();
      step3();
    });
  }

  function step3(){
    removeProofLinesFrom(3);
    setInstruction(3, '빗변 $AB=AD$, 직각 $\\angle C$, 한 예각 $\\angle B=\\angle D$가 같으므로 <strong>RHA/RHS 합동</strong>이 성립합니다', '최종 합동 결과를 정리해보세요.', '두 직각삼각형에서 빗변의 길이와 한 변의 길이가 각각 같으면 합동입니다 (RHS 합동).');

    buildQuiz(proofPanel, '$\\triangle ABC \\equiv \\triangle ADC$의 최종 직각삼각형 합동 조건은?', ['RHS 합동','RHA 합동','SAS 합동'], 0, ()=>{
      addProofLine(3, '$\\triangle ABC \\equiv \\triangle ADC$ (RHS 합동)', '빗변(H)의 길이와 한 변(S)의 길이가 각각 같습니다');

/* ==========================================================================
   Tab 4: 직각삼각형의 RHA 합동 (빗변과 한 예각이 같을 때)
   ========================================================================== */
function initTab4(startStep = 1){
  clearCanvas(); clearProof();
  const A = {x:270,y:90}, B = {x:70,y:330}, C = {x:270,y:330};
  const D = {x:400,y:90}, E = {x:600,y:330}, F = {x:400,y:330};

  function drawBase(){
    const g = el('g');
    g.appendChild(lineEl(A,B)); g.appendChild(lineEl(B,C)); g.appendChild(lineEl(C,A));
    g.appendChild(el('path',{d:rightAngleMark(C, angleOf(C.x,C.y,A.x,A.y), angleOf(C.x,C.y,B.x,B.y),14), stroke:'var(--ink)','stroke-width':2, fill:'none'}));
    g.appendChild(tickMarks(A,B,2,'var(--orange)'));
    g.appendChild(labelDot(A,'A',{dy:-12})); g.appendChild(labelDot(B,'B',{dx:-14,dy:8})); g.appendChild(labelDot(C,'C',{dx:-14,dy:8}));

    g.appendChild(lineEl(D,E)); g.appendChild(lineEl(E,F)); g.appendChild(lineEl(F,D));
    g.appendChild(el('path',{d:rightAngleMark(F, angleOf(F.x,F.y,D.x,D.y), angleOf(F.x,F.y,E.x,E.y),14), stroke:'var(--ink)','stroke-width':2, fill:'none'}));
    g.appendChild(tickMarks(D,E,2,'var(--orange)'));
    g.appendChild(labelDot(D,'D',{dy:-12})); g.appendChild(labelDot(E,'E',{dx:14,dy:8})); g.appendChild(labelDot(F,'F',{dx:14,dy:8}));
    return g;
  }
  svg.appendChild(drawBase());

  const arcB = el('path',{stroke:'var(--blue)','stroke-width':2.5, fill:'none'});
  const arcE = el('path',{stroke:'var(--blue)','stroke-width':2.5, fill:'none'});
  const arcA = el('path',{stroke:'var(--amber)','stroke-width':2.5, fill:'none', opacity:0});
  const arcD = el('path',{stroke:'var(--amber)','stroke-width':2.5, fill:'none', opacity:0});
  svg.appendChild(arcB); svg.appendChild(arcE); svg.appendChild(arcA); svg.appendChild(arcD);

  function step1(){
    removeProofLinesFrom(1);
    setInstruction(1, '슬라이더로 $\\angle B$와 $\\angle E$를 <strong>서로 같게($45^\\circ$)</strong> 맞춰보세요', '한 예각이 같아지면 나머지 한 각($90^\\circ - \\text{각}$)도 자동으로 같아집니다.', '두 슬라이더의 각도를 동일하게 맞추고 [각도 일치 확인] 버튼을 누르세요.');

    const fo = el('foreignObject',{x:50,y:385,width:540,height:75});
    fo.innerHTML = `
      <div style="display:flex; gap:16px; background:white; padding:8px 12px; border-radius:10px; border:1px solid var(--paper-edge); font-family:'JetBrains Mono',monospace; font-size:12px;">
        <div style="flex:1">
          <label>$\\angle B$: <span id="bVal">35</span>° → $\\angle A = $ <span id="aVal">55</span>°</label>
          <input type="range" min="25" max="65" value="35" id="bSlider" style="width:100%" class="focus-ring">
        </div>
        <div style="flex:1">
          <label>$\\angle E$: <span id="eVal">50</span>° → $\\angle D = $ <span id="dVal">40</span>°</label>
          <input type="range" min="25" max="65" value="50" id="eSlider" style="width:100%" class="focus-ring">
        </div>
        <div style="display:flex; align-items:center;">
          <button id="matchBtn" class="quiz-btn focus-ring" style="padding:6px 12px; white-space:nowrap;">일치 확인</button>
        </div>
      </div>`;
    svg.appendChild(fo);

    const bSlider = fo.querySelector('#bSlider'), eSlider = fo.querySelector('#eSlider');
    const bVal = fo.querySelector('#bVal'), aVal = fo.querySelector('#aVal');
    const eVal = fo.querySelector('#eVal'), dVal = fo.querySelector('#dVal');

    function update(){
      const bDeg = +bSlider.value, eDeg = +eSlider.value;
      bVal.textContent = bDeg; aVal.textContent = 90 - bDeg;
      eVal.textContent = eDeg; dVal.textContent = 90 - eDeg;

      arcB.setAttribute('d', arcPath(B.x,B.y,24, 0, -bDeg));
      arcE.setAttribute('d', arcPath(E.x,E.y,24, 180 + eDeg, 180));
      renderMath(fo);
    }
    bSlider.addEventListener('input', update);
    eSlider.addEventListener('input', update);
    update();

    fo.querySelector('#matchBtn').addEventListener('click', ()=>{
      if (bSlider.value === eSlider.value){
        arcA.setAttribute('d', arcPath(A.x,A.y,22, angleOf(A.x,A.y,B.x,B.y), angleOf(A.x,A.y,C.x,C.y)));
        arcD.setAttribute('d', arcPath(D.x,D.y,22, angleOf(D.x,D.y,E.x,E.y), angleOf(D.x,D.y,F.x,F.y)));
        arcA.setAttribute('opacity',1); arcD.setAttribute('opacity',1);
        arcA.classList.add('pulse-glow'); arcD.classList.add('pulse-glow');
        fo.remove();
        addProofLine(1, '$\\angle B = \\angle E \\implies \\angle A = \\angle D$', '두 직각삼각형에서 빗변의 양 끝각이 각각 같습니다');
        markStepDone();
        step2();
      } else {
        shakeEl(fo);
      }
    });
  }

  function step2(){
    removeProofLinesFrom(2);
    setInstruction(2, '빗변의 길이와 그 양 끝각이 같으므로 <strong>기존 삼각형의 어떤 합동 조건</strong>에 해당할까요?', '빗변 $\\overline{AB}=\\overline{DE}$와 양 끝 두 각이 각각 같습니다.', '한 변(Side)과 양 끝 두 각(Angle)이 같으므로 ASA 합동입니다.');

    buildQuiz(proofPanel, '$\\triangle ABC \\equiv \\triangle DEF$ 일반 삼각형 합동 조건은?', ['SAS','ASA','SSS','RHA'], 1, ()=>{
      addProofLine(2, '$\\triangle ABC \\equiv \\triangle DEF$ (ASA 합동)', '빗변의 길이와 양 끝 각의 크기가 각각 같습니다');
      showConclusion('$\\triangle ABC \\equiv \\triangle DEF$ (빗변과 한 예각이 같은 RHA 합동 성립)');
      markStepDone();
    });
  }

  stepHistory = [step1, step2];
  stepHistory[startStep - 1]();
}

];

const tabNav = document.getElementById('tabNav');
const drawerNav = document.getElementById('drawerNav');
const drawerOverlay = document.getElementById('drawerOverlay');
const topicDrawer = document.getElementById('topicDrawer');
const topicMenuBtn = document.getElementById('topicMenuBtn');
const closeDrawerBtn = document.getElementById('closeDrawerBtn');
const currentTopicLabel = document.getElementById('currentTopicLabel');

function openDrawer(){
  if (!drawerOverlay || !topicDrawer) return;
  drawerOverlay.classList.remove('hidden');
  setTimeout(() => {
    drawerOverlay.classList.remove('opacity-0');
    topicDrawer.classList.remove('-translate-x-full');
  }, 10);
}

function closeDrawer(){
  if (!drawerOverlay || !topicDrawer) return;
  drawerOverlay.classList.add('opacity-0');
  topicDrawer.classList.add('-translate-x-full');
  setTimeout(() => {
    drawerOverlay.classList.add('hidden');
  }, 300);
}

if(topicMenuBtn) topicMenuBtn.addEventListener('click', openDrawer);
if(closeDrawerBtn) closeDrawerBtn.addEventListener('click', closeDrawer);
if(drawerOverlay) drawerOverlay.addEventListener('click', closeDrawer);

function renderTabNav(){
  if(tabNav) tabNav.innerHTML = '';
  if(drawerNav) drawerNav.innerHTML = '';

  TABS.forEach(t => {
    // 상단 데스크톱 탭
    if(tabNav){
      const b = document.createElement('button');
      b.className = 'tab-btn focus-ring' + (t.id === currentTab ? ' active' : '');
      b.innerHTML = `<i data-lucide="${t.icon}" class="w-4 h-4"></i><span>${t.label}</span>`;
      b.addEventListener('click', () => switchTab(t.id));
      tabNav.appendChild(b);
    }

    // 좌측 슬라이드 드로어 메뉴
    if(drawerNav){
      const db = document.createElement('button');
      db.className = 'flex items-center gap-3 p-3 rounded-xl font-600 text-[14px] text-left transition-all ' + 
        (t.id === currentTab ? 'bg-[var(--ink)] text-white shadow-md' : 'bg-slate-50 hover:bg-slate-100 text-[var(--ink)]');
      db.innerHTML = `
        <div class="w-8 h-8 rounded-lg flex items-center justify-center ${t.id === currentTab ? 'bg-white/20 text-white' : 'bg-white border border-[var(--paper-edge)] text-[var(--teal-dark)]'}">
          <i data-lucide="${t.icon}" class="w-4 h-4"></i>
        </div>
        <span>${t.label}</span>
      `;
      db.addEventListener('click', () => {
        switchTab(t.id);
        closeDrawer();
      });
      drawerNav.appendChild(db);
    }
  });

  const cur = TABS.find(t => t.id === currentTab);
  if (cur && currentTopicLabel) {
    currentTopicLabel.textContent = cur.label;
  }
  lucide.createIcons();
}

function switchTab(id){
  currentTab = id;
  currentStep = 1;
  renderTabNav();
  const targetTab = TABS.find(t => t.id === id);
  if (targetTab && targetTab.init) {
    targetTab.init(1);
  }
  lucide.createIcons();
}

// 이전 단계 버튼 동작
prevStepBtn.addEventListener('click', ()=>{
  if (currentStep > 1){
    currentStep--;
    const targetTab = TABS.find(t => t.id === currentTab);
    if (targetTab && targetTab.init) {
      targetTab.init(currentStep);
    }
    lucide.createIcons();
  }
});

// 처음부터 다시 버튼 동작
document.getElementById('resetBtn').addEventListener('click', () => {
  currentStep = 1;
  const targetTab = TABS.find(t => t.id === currentTab);
  if (targetTab && targetTab.init) {
    targetTab.init(1);
  }
  lucide.createIcons();
});

// 초기화 실행
window.addEventListener('DOMContentLoaded', ()=>{
  renderTabNav();
  switchTab(1);
});
</script>
</body>
</html>
