<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교 상담 시뮬레이션 게임</title>
    <style>
        * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .game-container { width: 100%; max-width: 600px; background: white; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; }
        
        /* Header & Status Bar */
        .header { background: #4f46e5; color: white; padding: 20px; }
        .student-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .student-name { font-size: 1.25rem; font-weight: bold; }
        .trust-container { background: rgba(255,255,255,0.2); border-radius: 12px; padding: 12px; }
        .trust-label { font-size: 0.85rem; margin-bottom: 6px; display: flex; justify-content: space-between; }
        .progress-bar { background: rgba(255,255,255,0.3); height: 12px; border-radius: 6px; overflow: hidden; }
        .progress-fill { background: #10b981; height: 100%; width: 50%; transition: width 0.4s ease, background-color 0.4s; }

        /* Scene & Dialogue Box */
        .scene-box { padding: 24px; min-height: 220px; background: #fafafa; border-bottom: 1px solid #eee; }
        .expression-tag { display: inline-block; background: #e0e7ff; color: #4338ca; padding: 4px 10px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; margin-bottom: 12px; }
        .dialogue { font-size: 1.05rem; line-height: 1.6; color: #1f2937; }

        /* Controls / Choices */
        .controls { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .choice-btn { background: white; border: 2px solid #e5e7eb; border-radius: 10px; padding: 14px 16px; text-align: left; font-size: 0.95rem; color: #374151; cursor: pointer; transition: all 0.2s; }
        .choice-btn:hover { border-color: #6366f1; background: #f5f3ff; color: #4338ca; }
        
        /* Custom Input */
        .input-group { display: flex; gap: 8px; margin-top: 6px; }
        .custom-input { flex: 1; border: 2px solid #e5e7eb; border-radius: 10px; padding: 12px; font-size: 0.95rem; }
        .send-btn { background: #4f46e5; color: white; border: none; border-radius: 10px; padding: 0 20px; font-weight: bold; cursor: pointer; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="game-container">
    <!-- 상태창 -->
    <div class="header">
        <div class="student-info">
            <span class="student-name" id="student-name">2학년 김민우</span>
            <span id="student-state" style="font-size: 0.9rem; opacity: 0.9;">상태: 불안함</span>
        </div>
        <div class="trust-container">
            <div class="trust-label">
                <span>신뢰도 (마음의 문)</span>
                <span id="trust-num">50%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="trust-bar"></div>
            </div>
        </div>
    </div>

    <!-- 대화 화면 -->
    <div class="scene-box">
        <span class="expression-tag" id="expression">👀 시선을 바닥에 고정한 채</span>
        <div class="dialogue" id="dialogue-text">
            "...선생님, 저 부르셨어요? 요즘 성적 많이 떨어져서 그러시는 거죠...?"
        </div>
    </div>

    <!-- 선택지 버튼 -->
    <div class="controls" id="choices-container">
        <button class="choice-btn" onclick="makeChoice(1)">A. "너 요즘 시험 기간인데 딴생각만 하더라? 무슨 일 있어?" (지적형)</button>
        <button class="choice-btn" onclick="makeChoice(2)">B. "성적 때문에 부른 건 아니야. 요즘 민우 얼굴이 많이 힘들어 보여서 걱정돼서 불렀단다." (공감형)</button>
        <button class="choice-btn" onclick="makeChoice(3)">C. "너 이대로 가다간 원하는 고등학교도 못 가. 정신 차려야지." (훈계형)</button>
        
        <div class="input-group">
            <input type="text" id="custom-text" class="custom-input" placeholder="직접 말할 대사를 입력하세요...">
            <button class="send-btn" onclick="submitCustom()">전송</button>
        </div>
    </div>
</div>

<script>
    let trust = 50;

    function updateTrust(change) {
        trust = Math.min(100, Math.max(0, trust + change));
        const bar = document.getElementById('trust-bar');
        const num = document.getElementById('trust-num');
        
        bar.style.width = trust + '%';
        num.innerText = trust + '%';

        if(trust < 30) bar.style.backgroundColor = '#ef4444';
        else if(trust > 70) bar.style.backgroundColor = '#10b981';
        else bar.style.backgroundColor = '#f59e0b';

        if(trust >= 80) {
            setTimeout(() => alert("🎉 [SUCCESS] 민우가 마음을 열고 눈물을 흘리며 속마음을 털어놓았습니다! 상담 성공!"), 300);
        } else if(trust <= 20) {
            setTimeout(() => alert("💥 [FAIL] 민우가 '더 이상 할 말 없어요'라며 상담실을 나가버렸습니다."), 300);
        }
    }

    function makeChoice(type) {
        const dialogue = document.getElementById('dialogue-text');
        const expression = document.getElementById('expression');

        if(type === 1) { // 지적
            updateTrust(-10);
            expression.innerText = "😒 입술을 깨물며 방어적인 태도로";
            dialogue.innerText = "...그냥 좀 피곤해서 그랬어요. 별일 없는데요.";
        } else if(type === 2) { // 공감
            updateTrust(+15);
            expression.innerText = "🥺 고개를 살짝 들고 놀란 눈으로";
            dialogue.innerText = "...진짜 성적 때문이 아니에요? 사실... 요즘 집에서 부모님이 계속 싸우셔서 잠을 거의 못 자요...";
        } else if(type === 3) { // 훈계
            updateTrust(-20);
            expression.innerText = "😠 창밖을 보며 고개를 돌림";
            dialogue.innerText = "알아서 할게요. 어차피 선생님도 제 성적에만 관심 있으신 거잖아요.";
        }
    }

    function submitCustom() {
        const input = document.getElementById('custom-text');
        if(!input.value.trim()) return;
        
        updateTrust(+10);
        document.getElementById('expression').innerText = "🤔 선생님의 말을 가만히 들으며";
        document.getElementById('dialogue-text').innerText = `"...'${input.value}'라고 말씀해 주셔서 조금은 안심이 돼요."`;
        input.value = '';
    }
</script>
</body>
</html>
