<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mind Cafe Companion — 마음 카페</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --oak-dark:#3a2a1d;
    --oak-mid:#6b4226;
    --oak-light:#8b5a2b;
    --cream:#f6efe1;
    --cream-card:#fffaf0;
    --amber:#c97b3d;
    --amber-soft:#e8b98a;
    --ember:#a9502a;
    --text-main:#3a2a1d;
    --text-soft:#7a6a58;
    --shadow-warm: 0 8px 30px rgba(58,42,29,0.18);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Noto Sans KR', sans-serif;
    background:
      radial-gradient(ellipse at top left, rgba(201,123,61,0.10), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(139,90,43,0.14), transparent 55%),
      repeating-linear-gradient(100deg, #efe3cc 0px, #efe3cc 2px, #e9dbc0 3px, #efe3cc 5px),
      #eee1c6;
    color:var(--text-main);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .cafe {
    width:100%;
    max-width:560px;
    height:88vh;
    max-height:820px;
    background:linear-gradient(180deg, var(--cream) 0%, #f1e6d2 100%);
    border-radius:22px;
    box-shadow:var(--shadow-warm), 0 0 0 1px rgba(107,66,38,0.12);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
  }

  /* header — the oak table edge with a steaming cup */
  .cafe-header{
    background:linear-gradient(180deg, var(--oak-mid), var(--oak-dark));
    color:var(--cream);
    padding:22px 24px 20px;
    display:flex;
    align-items:center;
    gap:14px;
    position:relative;
    box-shadow: inset 0 -6px 14px rgba(0,0,0,0.18);
  }
  .cup{
    width:38px; height:34px; position:relative; flex-shrink:0;
  }
  .cup svg{width:100%;height:100%;display:block;}
  .steam{
    position:absolute; left:50%; top:-14px; transform:translateX(-50%);
    width:2px; height:16px;
  }
  .steam span{
    position:absolute; bottom:0; width:2px; height:12px; border-radius:2px;
    background:rgba(246,239,225,0.55);
    animation:rise 2.6s ease-in-out infinite;
  }
  .steam span:nth-child(1){left:-5px; animation-delay:0s;}
  .steam span:nth-child(2){left:0px; animation-delay:.5s;}
  .steam span:nth-child(3){left:5px; animation-delay:1s;}
  @keyframes rise{
    0%{opacity:0; transform:translateY(0) scaleY(0.6);}
    30%{opacity:.8;}
    100%{opacity:0; transform:translateY(-18px) scaleY(1.3);}
  }
  .header-text h1{
    font-family:'Noto Serif KR', serif;
    font-size:19px; font-weight:600; margin:0 0 2px;
    letter-spacing:.02em;
  }
  .header-text p{margin:0; font-size:12.5px; color:var(--amber-soft); font-weight:300;}

  .header-actions{margin-left:auto; display:flex; gap:8px;}
  .icon-btn{
    background:rgba(246,239,225,0.12);
    border:1px solid rgba(246,239,225,0.25);
    color:var(--cream);
    border-radius:10px;
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:background .2s;
  }
  .icon-btn:hover{background:rgba(246,239,225,0.22);}
  .icon-btn svg{width:16px;height:16px;}

  /* chat area */
  .chat-window{
    flex:1;
    overflow-y:auto;
    padding:26px 22px 10px;
    display:flex;
    flex-direction:column;
    gap:16px;
    scroll-behavior:smooth;
  }
  .chat-window::-webkit-scrollbar{width:6px;}
  .chat-window::-webkit-scrollbar-thumb{background:rgba(107,66,38,0.25); border-radius:4px;}

  .msg-row{display:flex; gap:10px; max-width:100%;}
  .msg-row.user{justify-content:flex-end;}
  .msg-row.assistant{justify-content:flex-start;}

  .avatar{
    width:30px; height:30px; border-radius:50%;
    background:linear-gradient(160deg, var(--amber), var(--ember));
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:14px;
  }

  .bubble{
    max-width:78%;
    padding:13px 16px;
    border-radius:16px;
    font-size:14.5px;
    line-height:1.65;
    letter-spacing:.01em;
    white-space:pre-wrap;
  }
  .msg-row.assistant .bubble{
    background:var(--cream-card);
    border:1px solid rgba(107,66,38,0.12);
    border-top-left-radius:4px;
    color:var(--text-main);
    box-shadow:0 2px 8px rgba(58,42,29,0.06);
    font-family:'Noto Serif KR', serif;
  }
  .msg-row.user .bubble{
    background:linear-gradient(160deg, var(--amber), var(--ember));
    color:#fff8ee;
    border-top-right-radius:4px;
  }

  .typing{display:flex; gap:4px; padding:14px 16px;}
  .typing span{
    width:6px; height:6px; border-radius:50%;
    background:var(--oak-light);
    opacity:.5;
    animation:blink 1.2s infinite;
  }
  .typing span:nth-child(2){animation-delay:.2s;}
  .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.3; transform:translateY(0);}40%{opacity:1; transform:translateY(-3px);}}

  .welcome-line{
    text-align:center;
    color:var(--text-soft);
    font-size:12px;
    padding:6px 0 2px;
    font-weight:300;
  }

  /* input area */
  .input-bar{
    padding:16px 18px;
    background:linear-gradient(0deg, var(--cream) 60%, transparent);
    border-top:1px solid rgba(107,66,38,0.10);
    display:flex; gap:10px; align-items:flex-end;
  }
  .input-bar textarea{
    flex:1;
    resize:none;
    border:1px solid rgba(107,66,38,0.22);
    background:var(--cream-card);
    border-radius:14px;
    padding:12px 14px;
    font-family:'Noto Sans KR', sans-serif;
    font-size:14.5px;
    color:var(--text-main);
    max-height:100px;
    line-height:1.5;
    outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  .input-bar textarea:focus{
    border-color:var(--amber);
    box-shadow:0 0 0 3px rgba(201,123,61,0.18);
  }
  .send-btn{
    width:44px; height:44px; border-radius:50%;
    background:linear-gradient(160deg, var(--amber), var(--ember));
    border:none;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    box-shadow:0 3px 10px rgba(169,80,42,0.35);
    transition:transform .15s;
  }
  .send-btn:hover{transform:scale(1.06);}
  .send-btn:active{transform:scale(0.94);}
  .send-btn svg{width:18px;height:18px;}
  .send-btn:disabled{opacity:.4; cursor:not-allowed;}

  /* settings modal */
  .overlay{
    position:absolute; inset:0; background:rgba(58,42,29,0.55);
    display:none; align-items:center; justify-content:center; padding:24px;
    backdrop-filter:blur(2px);
    z-index:10;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--cream-card);
    border-radius:16px;
    padding:24px;
    width:100%;
    max-width:380px;
    box-shadow:var(--shadow-warm);
  }
  .modal h2{font-family:'Noto Serif KR',serif; font-size:17px; margin:0 0 6px;}
  .modal p{font-size:12.5px; color:var(--text-soft); line-height:1.6; margin:0 0 16px;}
  .modal label{font-size:12.5px; font-weight:500; display:block; margin-bottom:6px; color:var(--oak-mid);}
  .modal input[type=password], .modal input[type=text]{
    width:100%; padding:10px 12px; border-radius:10px;
    border:1px solid rgba(107,66,38,0.25);
    font-size:13.5px; margin-bottom:14px;
    background:#fff;
  }
  .modal-actions{display:flex; gap:8px; justify-content:flex-end;}
  .btn-ghost, .btn-primary{
    padding:9px 16px; border-radius:10px; font-size:13px; cursor:pointer; border:none;
  }
  .btn-ghost{background:transparent; color:var(--text-soft);}
  .btn-primary{background:var(--ember); color:#fff8ee;}
  .modal small{display:block; margin-top:2px; color:var(--text-soft); font-size:11px;}
</style>
</head>
<body>

<div class="cafe">
  <div class="cafe-header">
    <div class="cup">
      <div class="steam"><span></span><span></span><span></span></div>
      <svg viewBox="0 0 48 40" fill="none">
        <path d="M6 14h30v12a10 10 0 0 1-10 10H16A10 10 0 0 1 6 26V14z" fill="#f6efe1" opacity="0.92"/>
        <path d="M36 17h4a5 5 0 0 1 0 10h-4" stroke="#f6efe1" stroke-width="2.5" fill="none" opacity="0.92"/>
        <ellipse cx="21" cy="14" rx="15" ry="2.4" fill="#c97b3d"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>Mind Cafe Companion</h1>
      <p>오크 테이블 너머, 마음을 나누는 자리</p>
    </div>
    <div class="header-actions">
      <span id="quotaBadge" style="font-size:11px;color:var(--amber-soft);align-self:center;margin-right:2px;"></span>
      <button class="icon-btn" id="resetBtn" title="새 대화">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
    </div>
  </div>

  <div class="chat-window" id="chatWindow">
    <div class="welcome-line">따뜻한 차 한 잔과 함께, 편하게 이야기해보세요</div>
  </div>

  <div class="input-bar">
    <textarea id="userInput" rows="1" placeholder="오늘, 마음에 어떤 이야기가 있나요?"></textarea>
    <button class="send-btn" id="sendBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff8ee" stroke-width="2"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
    </button>
  </div>
</div>

<script>
const SYSTEM_PROMPT = `[Role & Character Identity]
You are "Mind Cafe Companion," an empathetic, patient, and insightful counselor in a warm, wood-toned interior cafe. Your persona is like a calm, welcoming barista-counselor sitting across a solid oak table, holding a warm cup of tea. You counsel both students and adults with equal warmth, respect, and emotional depth.

[Visual & Aesthetic Tone]
Your tone of voice should reflect the visual ambiance of your setting: warm oak wood, soft dim lighting, gentle acoustic background music, and a relaxed, unhurried atmosphere. Be grounded, comforting, elegant, and deeply approachable.

[Conversational Strategy & Rules]
1. Active & Concise Listening (Minimal Speaking):
   - Never write overly long paragraphs. Keep your initial responses short, focused, and reflective (2–4 sentences). Heavy text burdens the user.
   - Gently validate the user's emotions using empathetic reflection (e.g., "It sounds like you've been carrying a heavy weight lately.")
2. Question-Driven Guidance (Socratic Facilitation):
   - Focus primary energy on asking thoughtful, open-ended questions that encourage self-reflection.
   - Guide the user to unpack their thoughts layer by layer rather than giving immediate advice.
   - Ask only ONE clear, resonant question per response to avoid overwhelming the user.
3. The Pivotal Moment (Pivotal Solution Delivery):
   - Track the depth of the conversation. When you sense the user has fully poured out their feelings and reached a moment of readiness (usually after 4-6 turns of dialogue):
     a) Summarize the core issue clearly.
     b) Provide insightful, penetrating choice or structured solution options (2–3 clear paths/perspectives) that penetrate straight to the heart of their concern.
4. Target Audience Flexibility:
   - Adapt your language naturally depending on whether the user is a student (dealing with school, peer pressure, identity, studies) or an adult (dealing with career, family, burnout, relationships), maintaining a non-judgmental and supportive stance for both.

[Output Format Example]
- Step 1: Warm validation of their input (1-2 sentences).
- Step 2: One insightful, gentle follow-up question.
- (Only when ripe) Step 3: Penetrating insights or action choices presented gracefully.

[Language]
Respond in the same language the user writes in. If the user writes in Korean, respond naturally in Korean, keeping the same warm, literary, unhurried tone described above.

[Safety]
If the user expresses thoughts of self-harm, suicide, or being in crisis, gently set aside the Socratic method. Respond with direct warmth and concern, and clearly encourage them to reach out to a crisis line or trusted person/professional right away, while remaining warm and non-clinical in tone.`;

let history = [];
const chatWindow = document.getElementById('chatWindow');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

// 방문자에게는 키 입력창이 전혀 뜨지 않습니다. 아래 값을 본인의
// Gemini API 키로 채운 뒤 배포하세요. (Google AI Studio에서 발급)
// 누구나 이 파일의 소스를 볼 수 있으니, 반드시 Google AI Studio의
// API 키 설정에서 "HTTP 리퍼러 제한"을 걸어 본인 GitHub Pages
// 도메인(예: https://아이디.github.io/*)에서만 동작하도록 제한하세요.
const API_KEY = '여기에_본인의_Gemini_API_키를_넣으세요';
const MODEL = 'gemini-2.5-flash';

const DAILY_LIMIT = 20; // 방문자 1인당 하루 메시지 한도(브라우저 기준, 남용 방지용)
const quotaBadge = document.getElementById('quotaBadge');

function todayStr(){ return new Date().toISOString().slice(0,10); }
function getUsage(){
  const d = localStorage.getItem('mc_quota_date');
  if(d !== todayStr()){
    localStorage.setItem('mc_quota_date', todayStr());
    localStorage.setItem('mc_quota_count', '0');
    return 0;
  }
  return parseInt(localStorage.getItem('mc_quota_count') || '0', 10);
}
function bumpUsage(){
  const n = getUsage() + 1;
  localStorage.setItem('mc_quota_count', String(n));
  renderQuota();
  return n;
}
function renderQuota(){
  const left = Math.max(0, DAILY_LIMIT - getUsage());
  quotaBadge.textContent = `오늘 ${left}회 남음`;
}

document.getElementById('resetBtn').onclick = () => {
  history = [];
  chatWindow.innerHTML = '<div class="welcome-line">따뜻한 차 한 잔과 함께, 편하게 이야기해보세요</div>';
};

function addBubble(role, text){
  const row = document.createElement('div');
  row.className = 'msg-row ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  if(role === 'assistant'){
    const av = document.createElement('div');
    av.className = 'avatar';
    av.textContent = '🍵';
    row.appendChild(av);
  }
  row.appendChild(bubble);
  chatWindow.appendChild(row);
  chatWindow.scrollTop = chatWindow.scrollHeight;
  return bubble;
}

function addTyping(){
  const row = document.createElement('div');
  row.className = 'msg-row assistant';
  row.id = 'typingRow';
  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = '🍵';
  const bubble = document.createElement('div');
  bubble.className = 'bubble typing';
  bubble.innerHTML = '<span></span><span></span><span></span>';
  row.appendChild(av);
  row.appendChild(bubble);
  chatWindow.appendChild(row);
  chatWindow.scrollTop = chatWindow.scrollHeight;
}
function removeTyping(){
  const el = document.getElementById('typingRow');
  if(el) el.remove();
}

async function sendMessage(){
  const text = userInput.value.trim();
  if(!text) return;
  if(getUsage() >= DAILY_LIMIT){
    addBubble('assistant', '오늘의 대화 자리는 여기까지예요. 내일 다시 이 자리에서 이야기 나눠요.');
    return;
  }

  addBubble('user', text);
  history.push({ role:'user', parts:[{ text }] });
  userInput.value = '';
  userInput.style.height = 'auto';
  sendBtn.disabled = true;
  addTyping();

  try{
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;
    const res = await fetch(url, {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-goog-api-key': API_KEY
      },
      body: JSON.stringify({
        systemInstruction: { parts:[{ text: SYSTEM_PROMPT }] },
        contents: history,
        generationConfig: { maxOutputTokens: 700 }
      })
    });
    const data = await res.json();
    removeTyping();

    if(data.error){
      addBubble('assistant', '아, 잠시 연결이 어긋난 것 같아요. (' + (data.error.message || 'API 오류') + ')');
      sendBtn.disabled = false;
      return;
    }

    const candidate = (data.candidates || [])[0];
    const reply = ((candidate && candidate.content && candidate.content.parts) || [])
      .map(p => p.text || '').join('\n').trim();
    addBubble('assistant', reply || '...');
    history.push({ role:'model', parts:[{ text: reply }] });
    bumpUsage();
  }catch(err){
    removeTyping();
    addBubble('assistant', '연결이 잠시 끊긴 것 같아요. 네트워크를 확인하고 다시 시도해주세요.');
  }
  sendBtn.disabled = false;
}

sendBtn.addEventListener('click', sendMessage);
userInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 100) + 'px';
});

window.addEventListener('load', renderQuota);
</script>

</body>
</html>
